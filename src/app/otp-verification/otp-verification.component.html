<div class="cafe-otp-wrapper">
  <div class="cafe-otp-container">
    <div class="cafe-header">
      <img src="assets/logo.png" alt="Auntie's Kitchen Logo" class="cafe-logo">
      <h1>Verify Your Account</h1>
      <p class="tagline">Just one more step to your Bright Life Ahead!</p>
    </div>

    <div class="cafe-form-card">
      <h2>OTP Verification</h2>
      <p class="otp-info" *ngIf="email">An OTP has been sent to your email: <strong>{{ email }}</strong></p>
      <p class="otp-info error" *ngIf="!email">Email not provided. Please register again.</p>

      <form (ngSubmit)="onVerifyOtp()" class="cafe-otp-form">
        <div class="form-field">
          <label for="otp">Enter OTP</label>
          <input type="text" id="otp" [(ngModel)]="otp" name="otp" required maxlength="6" pattern="[0-9]{6}" placeholder="e.g., 123456">
        </div>
        <button type="submit" class="cafe-btn-primary" [disabled]="!isOtpValid()">Verify OTP</button>
      </form>

      <div *ngIf="message" class="feedback-message {{ message.includes('successful') ? 'success' : 'error' }}">
        {{ message }}
      </div>

      <div class="cafe-links otp-actions">
        <button (click)="onResendOtp()" [disabled]="!email" class="cafe-btn-secondary">Resend OTP</button>
        <p>
          <a routerLink="/register" class="cafe-link">Go back to Registration</a>
        </p>
      </div>
    </div>
  </div>
</div>
