<div class="otp-verification-container">
  <h2>OTP Verification</h2>
  <p *ngIf="email">An OTP has been sent to your email: <strong>{{ email }}</strong></p>
  <p *ngIf="!email" class="error-message">Email not provided. Please register again.</p>

  <form (ngSubmit)="onVerifyOtp()">
    <div class="form-group">
      <label for="otp">Enter OTP:</label>
      <input type="text" id="otp" [(ngModel)]="otp" name="otp" required maxlength="6" pattern="[0-9]{6}">
    </div>
    <button type="submit" [disabled]="!isOtpValid()">Verify OTP</button>
  </form>

  <p *ngIf="message" class="feedback-message">{{ message }}</p>

  <div class="otp-actions">
    <button (click)="onResendOtp()" [disabled]="!email">Resend OTP</button>
    <p>
      <a routerLink="/register">Go back to Registration</a>
    </p>
  </div>
</div>
